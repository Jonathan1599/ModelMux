services:
  gateway:
    build:
      context: .
    environment:
      PORT: 3000
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3000:3000"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
