services:
  gateway:
    build:
      context: .
    environment:
      PORT: 3000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_REQUEST_TIMEOUT_MS: ${OLLAMA_REQUEST_TIMEOUT_MS:-120000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_FALLBACK_MODEL_MAP: ${OPENAI_FALLBACK_MODEL_MAP:-}
      OPENAI_REQUEST_TIMEOUT_MS: ${OPENAI_REQUEST_TIMEOUT_MS:-30000}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_RESET_TIMEOUT_MS: ${CIRCUIT_BREAKER_RESET_TIMEOUT_MS:-30000}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://modelmux:modelmux@host.docker.internal:5432/modelmux}
      REDIS_URL: redis://redis:6379
      CHAT_CACHE_TTL_SECONDS: ${CHAT_CACHE_TTL_SECONDS:-300}
      CHAT_CACHE_MAX_ENTRY_BYTES: ${CHAT_CACHE_MAX_ENTRY_BYTES:-65536}
      CHAT_CACHE_TIMEOUT_MS: ${CHAT_CACHE_TIMEOUT_MS:-100}
      CHAT_CACHE_VERSION: ${CHAT_CACHE_VERSION:-1}
      PROVIDER_MAX_CONCURRENCY: 2
      PROVIDER_MAX_QUEUE_SIZE: 20
      PROVIDER_QUEUE_TIMEOUT_MS: 30000
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_BACKOFF_MS: ${JOB_BACKOFF_MS:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    stop_grace_period: ${PROVIDER_STOP_GRACE_PERIOD:-180s}
    depends_on:
      ollama:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
    command: ["node", "dist/worker.js"]
    restart: on-failure
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_REQUEST_TIMEOUT_MS: ${OLLAMA_REQUEST_TIMEOUT_MS:-120000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_FALLBACK_MODEL_MAP: ${OPENAI_FALLBACK_MODEL_MAP:-}
      OPENAI_REQUEST_TIMEOUT_MS: ${OPENAI_REQUEST_TIMEOUT_MS:-30000}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      CIRCUIT_BREAKER_RESET_TIMEOUT_MS: ${CIRCUIT_BREAKER_RESET_TIMEOUT_MS:-30000}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://modelmux:modelmux@host.docker.internal:5432/modelmux}
      RABBITMQ_URL: amqp://modelmux:modelmux@rabbitmq:5672
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_BACKOFF_MS: ${JOB_BACKOFF_MS:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: ${PROVIDER_STOP_GRACE_PERIOD:-180s}
    depends_on:
      ollama:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: modelmux
      RABBITMQ_DEFAULT_PASS: modelmux
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  ollama-data:
  redis-data:
  rabbitmq-data:
